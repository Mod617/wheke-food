<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion Livreur | WHÉKÉ FOOD</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 360px;
            background: #1e293b;
            border: 1px solid #334155;
            padding: 32px 24px;
            border-radius: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header-title {
            text-align: center;
            margin-bottom: 24px;
        }

        .header-title h3 {
            font-size: 20px;
            font-weight: 800;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .header-title p {
            font-size: 13px;
            color: #94a3b8;
            margin-top: 4px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 10px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: all 0.2s ease;
        }

        input::placeholder {
            color: #64748b;
        }

        input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background: #10b981;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.1s ease;
            margin-top: 8px;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-login:hover {
            background: #059669;
        }

        .btn-login:active {
            transform: scale(0.98);
        }

        .flash-message {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid #ef4444;
            color: #fca5a5;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 13px;
            text-align: center;
            margin-bottom: 16px;
        }

        .footer-link {
            text-align: center;
            margin-top: 20px;
        }

        .footer-link a {
            color: #94a3b8;
            text-decoration: none;
            font-size: 13px;
            transition: color 0.2s ease;
        }

        .footer-link a:hover {
            color: #ffffff;
        }
    </style>
</head>

<body>

<div class="login-card">

    <div class="header-title">
        <h3>🚴 Espace Livreur</h3>
        <p>Connectez-vous pour gérer vos livraisons</p>
    </div>

    <!-- MESSAGES FLASH (Erreurs / Succès) -->
    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for message in messages %}
                <div class="flash-message">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST">
        <!-- 🛡️ Protection CSRF (Flask-WTF / Flask-CSRF) -->
        {% if csrf_token %}
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        {% endif %}

        <div class="form-group">
            <input type="tel" name="telephone" placeholder="Numéro de téléphone" required autocomplete="tel">
        </div>

        <div class="form-group">
            <input type="password" name="password" placeholder="Mot de passe" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn-login">Se connecter</button>
    </form>

    <div class="footer-link">
        <a href="/">⬅ Retour au site</a>
    </div>

</div>

</body>
</html>

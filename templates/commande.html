<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finaliser commande - WHÉKÉ FOOD</title>
    <link rel="stylesheet" href="/static/style.css">

    <style>
        :root {
            --primary: #ff6b00;
            --primary-hover: #e05e00;
            --bg-color: #0f172a;
            --surface: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --radius: 12px;
            --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: var(--bg-color);
            color: var(--text-main);
            line-height: 1.5;
            padding-bottom: 40px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.8rem 1.25rem;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .logo img {
            height: 40px;
            width: 40px;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid var(--primary);
        }

        .logo h2 {
            font-size: 1.15rem;
            font-weight: 800;
            color: #ffffff;
        }

        .btn-back {
            text-decoration: none;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.9rem;
            transition: color 0.2s ease;
        }

        .btn-back:hover {
            color: #ffffff;
        }

        .container {
            max-width: 480px;
            margin: 1.5rem auto;
            padding: 0 1rem;
        }

        .card {
            background: var(--surface);
            padding: 1.5rem;
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border);
        }

        h2.title {
            text-align: center;
            margin-bottom: 1.25rem;
            font-size: 1.35rem;
            font-weight: 700;
            color: #ffffff;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 0.35rem;
        }

        input[type="text"], select {
            width: 100%;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            font-size: 0.95rem;
            background-color: #0f172a;
            color: var(--text-main);
            transition: border-color 0.2s ease;
            outline: none;
        }

        input[type="text"]:focus, select:focus {
            border-color: var(--primary);
        }

        .btn {
            width: 100%;
            padding: 0.85rem 1rem;
            border: none;
            border-radius: 8px;
            background: var(--primary);
            color: white;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s ease;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
        }

        .btn:hover {
            background: var(--primary-hover);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #0f172a;
            color: var(--text-main);
            border: 1px solid var(--border);
            margin-bottom: 1rem;
        }

        .btn-secondary:hover {
            background: #1e293b;
            border-color: var(--text-muted);
        }

        .panier-box {
            background: #0f172a;
            border: 1px solid var(--border);
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.25rem;
        }

        .item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 0.75rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px dashed var(--border);
        }

        .item:last-child {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
        }

        .total {
            font-weight: 700;
            text-align: right;
            margin-top: 0.75rem;
            padding-top: 0.75rem;
            border-top: 2px solid var(--border);
            font-size: 1.05rem;
            color: var(--primary);
        }

        #boxPrix {
            margin: 1rem 0;
            background: rgba(255, 107, 0, 0.1);
            border: 1px solid var(--primary);
            color: #f8fafc;
            padding: 0.85rem;
            border-radius: 8px;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        /* DROPDOWN CUSTOM */
        .dropdown {
            position: relative;
            margin-bottom: 1rem;
        }

        .dropdown-btn {
            padding: 0.75rem 1rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: #0f172a;
            color: var(--text-main);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.95rem;
        }

        .dropdown-btn:after {
            content: "▼";
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .dropdown-content {
            display: none;
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            right: 0;
            background: #1e293b;
            border-radius: 8px;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border);
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.25s ease;
            z-index: 1000;
        }

        .dropdown-content.show {
            display: block;
            max-height: 260px;
            overflow-y: auto;
        }

        .dropdown-content input {
            margin: 0.5rem;
            width: calc(100% - 1rem);
            padding: 0.6rem;
            border-radius: 6px;
        }

        .quartier-item {
            padding: 0.75rem 1rem;
            cursor: pointer;
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
            color: var(--text-main);
        }

        .quartier-item:last-child {
            border-bottom: none;
        }

        .quartier-item:hover {
            background: #0f172a;
            color: var(--primary);
        }
    </style>
</head>

<body>

<header>
    <div class="logo">
        <img src="{{ url_for('static', filename='logo.jpg') }}" alt="Logo WHÉKÉ FOOD">
        <h2>WHÉKÉ FOOD</h2>
    </div>
    <a href="/" class="btn-back">← Retour</a>
</header>

<div class="container">
    <div class="card">
        <h2 class="title">Finaliser ma commande</h2>

        <div class="panier-box" id="panierBox"></div>

        <div class="form-group">
            <label for="telephone">Numéro de téléphone</label>
            <input type="text" id="telephone" placeholder="ex: 97000000">
        </div>

        <div class="form-group">
            <label for="livraison">Mode de livraison</label>
            <select id="livraison">
                <option value="">-- Choisir le type --</option>
                <option value="standard">🚚 Standard</option>
                <option value="express">⚡ Express</option>
            </select>
        </div>

        <div class="form-group">
            <label>Quartier de livraison</label>
            <div class="dropdown">
                <div class="dropdown-btn" onclick="toggleDropdown()">
                    <span id="selectedQuartier">-- Choisir un quartier --</span>
                </div>

                <div class="dropdown-content" id="dropdownContent">
                    <input type="text" id="searchQuartier" placeholder="🔍 Rechercher quartier...">
                    <div id="quartierList"></div>
                </div>
            </div>
        </div>

        <div class="form-group">
            <input type="text" id="quartierLibre" placeholder="Autre quartier (si non listé)">
        </div>

        <button type="button" class="btn btn-secondary" onclick="envoyerLocalisation()">📍 Utiliser ma position GPS</button>

        <div id="boxPrix" style="display: none;"></div>

        <button type="button" class="btn" onclick="envoyerCommande(event)">✅ Valider la commande</button>
    </div>
</div>

<script>
let gps = null;
let selectedQuartier = "";

const zonesData = {
    "A": { quartiers:["Sainte Cécile","Ladji","Sikècodji","16 Ampoules","Vossa","Gbejdromede","Gbegamey","Jéricho","Saint Jean","Zongo","Houéyiho","Cadjèhoun","Cocotiers","Haie Vive","Guinkomey","Étoile Rouge"], standard:500, express:800 },
    "B": { quartiers:["Adogleta","Segbeya","Djidjè","Dantokpa","Ganhi","Jonquet","Avakpa","Xwlacodji","Tokpa Hoho","Hindé","Vêdoko","Saint Michel","Enagnon","Akpakpa Centre"], standard:800, express:1000 },
    "C": { quartiers:["Godomey","Fidjrossè","Agla","Kouhounou","Ménontin","Ste Rita","Fifadji","Jak","Kindonou","Lobozounkpa","Tankpè","Sèkandji","Ablangandan"], standard:1000, express:1300 },
    "D": { quartiers:["Université (UAC)","Calavi Kpota","IITA","Bidossessi","Arconville","Zogbadjè","Akpakpa PK10","Togoudo","Houèto","Cocotomey"], standard:1200, express:1500 },
    "E": { quartiers:["Abomey-Calavi Marché","Ouédo","Togba","Pahou","Glo-Djigbé","Sèmè-Kpodji","Zinvié","Akassato","Atrokpocodji"], standard:1500, express:2000 }
};

function toggleDropdown(){
    let box = document.getElementById("dropdownContent");
    box.classList.toggle("show");
}

document.addEventListener("click", function(e){
    let dropdown = document.querySelector(".dropdown");
    if(dropdown && !dropdown.contains(e.target)){
        document.getElementById("dropdownContent").classList.remove("show");
    }
});

function afficherQuartiers(filtre=""){
    let container = document.getElementById("quartierList");
    container.innerHTML = "";

    for(let z in zonesData){
        zonesData[z].quartiers.forEach(q=>{
            if(q.toLowerCase().includes(filtre.toLowerCase())){
                let div = document.createElement("div");
                div.className = "quartier-item";
                div.innerText = q;

                div.onclick = () => {
                    selectedQuartier = q;
                    document.getElementById("selectedQuartier").innerText = q;
                    document.getElementById("quartierLibre").value = "";
                    document.getElementById("dropdownContent").classList.remove("show");
                    document.getElementById("searchQuartier").value = "";
                    afficherQuartiers();
                    calculer();
                };

                container.appendChild(div);
            }
        });
    }
}

document.getElementById("searchQuartier").addEventListener("keyup", function(){
    afficherQuartiers(this.value);
});

document.getElementById("quartierLibre").addEventListener("input", function(){
    if(this.value.trim() !== ""){
        selectedQuartier = "";
        document.getElementById("selectedQuartier").innerText = "-- Choisir un quartier --";
        calculer();
    }
});

afficherQuartiers();

function envoyerLocalisation(){
    if(navigator.geolocation){
        navigator.geolocation.getCurrentPosition(
            pos => {
                gps = pos.coords.latitude + "," + pos.coords.longitude;
                alert("Localisation GPS enregistrée ✅");
            },
            err => {
                alert("Impossible d'obtenir la position GPS.");
            }
        );
    } else {
        alert("Géolocalisation non supportée par votre navigateur.");
    }
}

function getZone(q){
    for(let z in zonesData){
        if(zonesData[z].quartiers.includes(q)) return z;
    }
    return null;
}

function calculer(){
    let qSelect = selectedQuartier;
    let qLibre = document.getElementById("quartierLibre").value.trim();
    let l = document.getElementById("livraison").value;
    let boxPrix = document.getElementById("boxPrix");

    let q = qLibre || qSelect;

    if(!q || !l) {
        boxPrix.style.display = "none";
        return;
    }

    boxPrix.style.display = "block";
    let zone = getZone(q);

    if(!zone){
        boxPrix.innerHTML = "🚚 Tarif de livraison sur mesure (confirmé par appel/WhatsApp lors du traitement).";
        return;
    }

    let prix = zonesData[zone][l];
    let totalPanier = parseInt(document.getElementById("totalPanier")?.innerText || "0", 10);
    let total = totalPanier + prix;

    boxPrix.innerHTML = `Frais de livraison : <strong>${prix} FCFA</strong><br>Grand Total : <strong style="color: var(--primary); font-size: 1.1rem;">${total} FCFA</strong>`;
}

document.getElementById("livraison").addEventListener("change", calculer);

function afficherPanierCommande(){
    let box = document.getElementById("panierBox");
    let data = JSON.parse(localStorage.getItem("panier") || "[]");

    if (data.length === 0) {
        box.innerHTML = `<div style="text-align:center; color: var(--text-muted);">Votre panier est vide</div>`;
        return;
    }

    let html = "";
    let total = 0;

    data.forEach(i => {
        let qte = i.quantite || i.qte || 1;
        let p = i.prix || 0;
        let sousTotal = p * qte;

        html += `
        <div class="item">
            ${i.image ? `<img src="${i.image}" style="width:45px;height:45px;border-radius:6px;object-fit:cover;" onerror="this.style.display='none'">` : ''}
            <div style="flex:1;">
                <div style="font-weight:600; font-size:0.95rem; color:#ffffff;">${i.nom}</div>
                <div style="font-size:0.85rem; color: var(--text-muted);">Quantité : ${qte}</div>
            </div>
            <span style="font-weight:600;">${sousTotal} FCFA</span>
        </div>
        `;
        total += sousTotal;
    });

    html += `<div class="total">Sous-total Panier : <span id="totalPanier">${total}</span> FCFA</div>`;
    box.innerHTML = html;
}

afficherPanierCommande();

function envoyerCommande(event) {
    if(event) event.preventDefault();

    let tel = document.getElementById("telephone").value.trim();
    let qSelect = selectedQuartier || "";
    let qLibre = document.getElementById("quartierLibre").value.trim();
    let gpsLocation = gps || ""; 

    let quartier = qLibre || qSelect;
    let livraison = document.getElementById("livraison").value;

    if(!tel) return alert("📞 Veuillez entrer votre numéro de téléphone.");
    if(!livraison) return alert("🚚 Veuillez choisir un mode de livraison.");
    if(!quartier && !gpsLocation) {
        return alert("📍 Précisez votre quartier ou activez votre position GPS.");
    }

    let panier = JSON.parse(localStorage.getItem("panier") || "[]");
    if(panier.length === 0) return alert("🛒 Votre panier est vide.");

    const btn = (event && event.target) ? event.target : document.querySelector(".btn:last-child");
    const texteOriginal = btn.innerText;
    btn.disabled = true;
    btn.innerText = "⏳ Validation en cours...";

    fetch("/commander", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            telephone: tel,
            adresse: quartier || "Position GPS",
            gps: gpsLocation,
            livraison: livraison,
            zone: quartier,
            panier: panier.map(p => ({ id: p.id, qte: p.quantite || p.qte || 1 }))
        })
    })
    .then(r => r.json())
    .then(r => {
        if(r.success && r.redirect_url){
            localStorage.removeItem("panier");
            window.location.href = r.redirect_url;
        } else {
            alert("❌ " + (r.message || "Erreur lors de la commande."));
            btn.disabled = false;
            btn.innerText = texteOriginal;
        }
    })
    .catch(err => {
        console.error(err);
        alert("❌ Erreur de connexion avec le serveur.");
        btn.disabled = false;
        btn.innerText = texteOriginal;
    });
}
</script>

</body>
</html>
